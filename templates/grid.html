<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POSPOM - Плитка</title>
  <link rel="stylesheet" href="/static/styles/index_style.css">
</head>
<body class="page-grid">
  <header class="header">
    <img src="http://localhost:9000/pospom-media/logo.jpg" alt="МЕДСИ" class="logo-img">
    <svg class="menu-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 12h18M3 6h18M3 18h18"/>
    </svg>
  </header>

  <div class="grid-container">
    <form method="GET" action="/grid" class="filter-form">
      <label for="maxAge">Возраст до:</label>
      <input type="number" id="maxAge" name="maxAge" placeholder="60" value="{{.maxAge}}">
      <button type="submit" class="filter-btn">
        <img src="/static/image/loop.png" alt="">
      </button>
    </form>

    <div class="grid-cards">
      {{range .factors}}
      <a href="/feed/{{.ID}}" class="grid-card">
        <img src="{{.ImageURL}}" alt="{{.Name}}" class="grid-card-image">
        <div class="grid-card-content">
          <h3 class="grid-card-title">{{.Name}}</h3>
          <div class="grid-card-footer">
            <span class="status-badge status-{{.Status}}">
              {{if eq .Status "published"}}опубликован{{end}}
              {{if eq .Status "draft"}}черновик{{end}}
            </span>
            <div class="card-likes">
              <svg viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
              </svg>
              {{len .LikedBy}}
            </div>
          </div>
        </div>
      </a>
      {{end}}
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/feed/1" class="nav-item">
      <img src="http://localhost:9000/pospom-media/feed.jpg" alt="Лента">
      <span>Лента</span>
    </a>
    <a href="/add" class="nav-item">
      <img src="http://localhost:9000/pospom-media/add.jpg" alt="Добавить">
      <span>Добавить</span>
    </a>
    <a href="/grid" class="nav-item">
      <img src="http://localhost:9000/pospom-media/hover-grid.jpg" alt="Плитка">
      <span>Плитка</span>
    </a>
  </nav>
</body>
</html>
