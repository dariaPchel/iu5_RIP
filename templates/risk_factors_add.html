<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POSPOM - Добавить</title>
  <link rel="stylesheet" href="/static/styles/index_style.css">
</head>
<body class="page-add">
  <header class="header">
    <img src="http://localhost:9000/pospom-media/logo.jpg" alt="МЕДСИ" class="logo-img">
    <svg class="menu-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 12h18M3 6h18M3 18h18"/>
    </svg>
  </header>

  <div class="add-container">
    <h1 class="add-title">Добавить фактор риска</h1>

    <div class="upload-section">
      <div class="upload-grid">
        <div class="upload-card">
          <div class="upload-text">Загрузить изображение</div>
        </div>
        <div class="upload-card">
          <div class="upload-text">Загрузить видео</div>
        </div>
      </div>
    </div>

    <!-- Поля ввода -->
    <div class="form-card">
      <label class="form-label">Название фактора риска</label>
      <input type="text" class="form-input" placeholder="Введите название">
      
      <label class="form-label">Описание</label>
      <textarea class="form-input" placeholder="Введите описание"></textarea>
      
      <label class="form-label" style="margin-top: 3px;">Тип операции</label>
      <input type="text" class="form-input" placeholder="Введите тип операции">
      
      <div class="form-row">
        <div>
          <label class="form-label">Возраст</label>
          <input type="number" class="form-input" placeholder="0">
        </div>
        <div>
          <label class="form-label">ИМТ</label>
          <input type="number" step="0.1" class="form-input" placeholder="0.0">
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/risk_factors_feed/1" class="nav-item">
      <img src="http://localhost:9000/pospom-media/feed.jpg" alt="Лента">
      <span>Лента</span>
    </a>
    <a href="/risk_factors_add" class="nav-item">
      <img src="http://localhost:9000/pospom-media/hover-add.jpg" alt="Добавить">
      <span>Добавить</span>
    </a>
    <a href="/risk_factors_grid" class="nav-item">
      <img src="http://localhost:9000/pospom-media/grid.jpg" alt="Плитка">
      <span>Плитка</span>
    </a>
  </nav>
</body>
</html>
